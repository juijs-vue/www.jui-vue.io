<div class="vmenu rect">
{% for g in group %}
    <a data-type="{{ g.type }}">{{ g.title }}</a>
    <ul class="submenu">
        {% for item in g.list %}
        <li{% if item.active %} class="active" data-parent="{{ g.type }}"{% endif %}>
            <a href="?p={{ item.code }}">{{ item.title }}</a>
        </li>
        {% endfor %}
    </ul>
{% endfor %}
</div>
