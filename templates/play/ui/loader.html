<!DOCTYPE html>
<html>
<head>
    <META charset="UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <script src="../../lib/vue/vue.global.js"></script>
    <script src="../../lib/jui-ui-vue/jui-ui-vue.umd.js"></script>
    <script src="../../lib/jui-grid-vue/jui-grid-vue.umd.js"></script>
    <link rel="stylesheet" href="../../lib/jui-ui-vue/style.css" />
    <link rel="stylesheet" href="../../lib/jui-grid-vue/style.css" />
    <link rel="stylesheet" href="../chart/chart.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="jui {{ theme | safe }}">
<div id="app"></div>
<script id="__play_code__" type="text/plain">{{ code | safe }}</script>
<script id="__play_html__" type="text/plain">{{ html | safe }}</script>
<script>
    (function () {
        var mount = document.getElementById("app");

        try {
            // The "Code" tab is a JS expression evaluating to a Vue options object
            // (typically just { setup() { ... return {...} } }); the "HTML" tab
            // becomes its template. This mirrors the old jui.ready(...) + markup
            // pair 1:1, just targeting Vue instead of jui.js/jQuery.
            var codeText = document.getElementById("__play_code__").textContent;
            var htmlText = document.getElementById("__play_html__").textContent;

            // Style-only examples (the "Common Styles" group) have no Code tab content -
            // the original never ran these through any templating at all, just raw HTML.
            // Feeding them through Vue's `template` option instead would still work for
            // the DOM structure, but Vue's compiler condenses whitespace-only text nodes
            // that span a line break (its default `whitespace: 'condense'` mode) - e.g. the
            // newline-separated "Save"/"Close" buttons in window.html lose the space that a
            // plain HTML parser (uiplay) keeps between them. Skipping Vue here entirely for
            // no-JS examples sidesteps that and matches the original byte-for-byte.
            if (!codeText.trim()) {
                mount.innerHTML = htmlText;
                return;
            }

            var options = (0, eval)("(" + codeText + ")");
            options.template = htmlText;

            var app = Vue.createApp(options);
            // Vue's default whitespace mode ('condense') strips whitespace-only text nodes
            // that span a line break - e.g. two <button class="btn mini"> written on separate
            // lines lose the natural inline-block gap a plain HTML parser (uiplay) keeps
            // between them. That gap isn't cosmetic here: button-group CSS (.group > * + *)
            // applies a negative margin sized assuming that gap is still there, so losing it
            // makes buttons visibly overlap more than intended (e.g. xtable_2/xtable_3's
            // Prev/Next pager). 'preserve' matches how uiplay's own (non-Vue) HTML renders.
            app.config.compilerOptions.whitespace = "preserve";
            app.use(JuiUiVue);
            app.use(JuiGridVue.default || JuiGridVue);

            app.config.errorHandler = function (err) {
                mount.innerHTML =
                    '<pre style="color:#c0392b;white-space:pre-wrap;padding:12px;">' +
                    String(err && err.stack || err) +
                    "</pre>";
                if (window.console) console.error(err);
            };

            app.mount("#app");
        } catch (err) {
            mount.innerHTML =
                '<pre style="color:#c0392b;white-space:pre-wrap;padding:12px;">' +
                String(err && err.stack || err) +
                "</pre>";
            if (window.console) console.error(err);
        }
    })();
</script>
</body>
</html>
