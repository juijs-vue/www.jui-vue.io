<!DOCTYPE html>
<html>
<head>
    {% include "play/header.html" %}
    {% include "play/chart/metadata.html" %}

    <link rel="stylesheet" href="../../lib/jui/css/ui-jennifer.min.css" />
    <link rel="stylesheet" href="chart.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="../../lib/jui-chart-vue/style.css">
    <link rel="stylesheet" href="../../lib/jui-ui-vue/style.css">
    <link rel="stylesheet" href="../../lib/jui-grid-vue/style.css">
    <script src="../../lib/vue/vue.global.js"></script>
    <script src="../../lib/jui-chart-vue/jui-chart-vue.umd.js"></script>
    <script src="../../lib/jui-ui-vue/jui-ui-vue.umd.js"></script>
    <script src="../../lib/jui-grid-vue/jui-grid-vue.umd.js"></script>
    <script src="chart.js" type="text/javascript"></script>
    <script src="resource/f16_model.js" type="text/javascript"></script>
</head>
<body class="jui">

<div class="header">
    <div class="logo">
        <img src="../../res/img/play_logo.png" align="absmiddle" onclick="window.open('http://jui.io', 'jui.site')" />
    </div>
    <div class="toolbar">
        <span>
            Themes
            <select onchange="changeTheme(this.value)">
                <option value="classic">Jennifer</option>
                <option value="dark">Dark</option>
                <option value="pastel">Pastel</option>
                <option value="gradient">Gradient</option>
                <option value="pattern">Pattern</option>
            </select>
        </span>

        <a href="javascript:comments.show();" class="chart_comments">Leave a comment</a>

        <i id="sidemenu" class="icon-menu"></i>
    </div>
</div>
<div class="container">
    <div class="menu">
        {% include "play/menu.html" %}
    </div>
    <div class="content">
        <div class="chart_data">
            <div class="chart_data_main">
                <div id="chart-tab-app">
                    <Tab v-model="tabIndex" :items="tabItems" position="top" @change="onTabChange">
                        <template #panel-code>
                            <textarea id="chart-code-text" v-pre>{{ code_content }}</textarea>
                        </template>
                        <template #panel-style>
                            <data-grid class="theme-grid" :columns="themeColumns" :rows="themeRows" editable resizable theme="classic" variant="simple" headline @row-edit="onThemeRowEdit">
                                <template #cell-value="{ row, value }">
                                    <span v-if="row.data.key === 'colors'" class="theme-colors-preview">
                                        <span v-for="(c, i) in String(value).split('|')" :key="i" class="theme-color-swatch" :style="{ background: c }" :title="c"></span>
                                    </span>
                                    <span v-else-if="isColorKey(row.data.key)" class="theme-color-swatch theme-color-swatch-wide" :style="{ background: value }" v-text="value"></span>
                                    <img v-else-if="isImageKey(row.data.key)" :src="value" class="theme-image-preview" />
                                    <span v-else v-text="value"></span>
                                </template>
                                <template #edit-value="{ row, draft, commit, cancel }">
                                    <div v-if="row.data.key === 'colors'" class="theme-edit-colors">
                                        <button type="button" class="btn small" @click="openColorsWindow(draft, commit, cancel)">Edit Colors&hellip;</button>
                                        <button type="button" class="btn small" @click="cancel">Cancel</button>
                                    </div>
                                    <div v-else-if="isColorKey(row.data.key)" class="theme-edit-color">
                                        <Colorpicker v-model="draft.value"></Colorpicker>
                                        <div class="theme-edit-color-actions">
                                            <button type="button" class="btn small" @click="commit">Apply</button>
                                            <button type="button" class="btn small" @click="cancel">Cancel</button>
                                        </div>
                                    </div>
                                    <input v-else class="edit" type="text" v-model="draft.value" @keyup.enter="commit" @blur="commit" @keyup.esc="cancel" />
                                </template>
                            </data-grid>
                        </template>
                    </Tab>

                    <div class="tools">
                        <div class="group">
                            <a class="btn small" @click="clearCode">Clear</a>
                            <a class="btn small" @click="clearAllCode">Clear All</a>
                        </div>

                        <a class="btn small" v-show="tabIndex === 0" title="Save source code" @click="saveCode"><i class="icon-save"></i></a>
                        {% if csv %}
                        <div class="group csv" v-show="tabIndex === 0">
                            <a class="btn small" title="Export CSV file" @click="exportCsv"><i class="icon-download"></i></a>
                            <input type="file" @change="importCsv" />
                            <a class="btn small" title="Import CSV file"><i class="icon-upload"></i></a>
                        </div>
                        {% endif %}
                        <div class="group theme" v-show="tabIndex === 1">
                            <a class="btn small" title="Export Theme file" @click="exportTheme"><i class="icon-download"></i></a>
                            <input type="file" @change="importTheme" />
                            <a class="btn small" title="Import Theme file"><i class="icon-upload"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="splitter splitter-2"></div>
        <div class="chart_view">
            <div class="chart-main">
                <div id="chart-content-title">
                    <h2>
                        Result

                        <div class="group">
                            <a class='btn btn-api' title="Chart API" href="http://api.jui.io/" target="_blank">API</a>
                            <a class='btn btn-image' title="Download Image"><i class='icon-image'></i></a>
                            <a class='btn btn-fullscreen' title="Full Screen"><i class='icon-new-window'></i></a>
                        </div>
                    </h2>
                </div>
                <div id="result"></div>
            </div>
        </div>
    </div>
</div>

<div id="chart-shell-modals">
    <Window v-model="colorsWinVisible" title="Edit Colors" :width="360" :height="420" modal :move="true" :resize="true">
        <data-grid class="theme-grid" :columns="colorsColumns" :rows="colorsRows" editable resizable theme="classic" variant="simple" headline>
            <template #cell-color="{ value }">
                <span class="theme-color-swatch theme-color-swatch-wide" :style="{ background: value }" v-text="value"></span>
            </template>
            <template #edit-color="{ draft, commit, cancel }">
                <Colorpicker v-model="draft.color"></Colorpicker>
                <div class="theme-edit-color-actions">
                    <button type="button" class="btn small" @click="commit">Apply</button>
                    <button type="button" class="btn small" @click="cancel">Cancel</button>
                </div>
            </template>
        </data-grid>

        <template #foot="{ hide }">
            <a href="#" class="btn focus" @click.prevent="saveColorsWindow(); hide()">Save</a>
            <a href="#" class="btn" @click.prevent="cancelColorsWindow(); hide()">Cancel</a>
        </template>
    </Window>

    <Notify ref="notifyRef" position="top-right" :timeout="3000"></Notify>
</div>

{% include "play/footer.html" %}
<script>
    // 아직 Jinja 템플릿 변수가 필요해서 이 인라인 스크립트에만 남아있다 - 나머지 페이지 초기화
    // 로직(에디터 마운트, 메뉴 활성 항목 표시)은 chart.js의 DOMContentLoaded 핸들러가 담당한다.
    function getChartKey() {
        return "{{ data.code }}";
    }
</script>

</body>
</html>
