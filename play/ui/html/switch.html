<section>
	<h2>Default</h2>
	<p>
		Switch provides a total of 2 styles including the basic type.

	</p>

		<div class="area">
			<div class="bar">
				<div class="left"></div>
				<div class="right"></div>
			</div>
		</div>
		<div class="handle"></div>
	</div>

	<div class="switch small">

			<div class="bar">
				<div class="left"></div>
				<div class="right"></div>

	</div>

	<div class="switch on">

				<div class="left"></div>

			</div>
		</div>

				<div class="right"></div>
