<button class="btn small" @click="submit">
    <i class="icon-play"></i> Run
</button>

<VirtualGrid
    ref="grid"
    :columns="columns"
    :rows="rows"
    mode="paging"
    :page-size="100"
    sortable
    resizable
    :sort-loading="true"
    :show-pager="false"
    style="margin-top: 7px;"
    @sort="onSort"
/>

<div style="margin-top: 3px;">
    <Paging ref="pagingRef" :count="rows.length" :page-count="100" @page="onPage" />
</div>
