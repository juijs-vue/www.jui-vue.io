<div class="jui-grid-vue-root theme-classic">
<table id="table_4" class="table classic borderless body-scroll">
    <thead>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Location</th>
        </tr>
    </thead>
    <tbody style="max-height: 150px; width: 536px;">
        <tr v-for="row in data" :key="row.name">
            <td style="width: 181.5px;">{{ row.name }}</td>
            <td style="width: 183px;">{{ row.age }}</td>
            <td style="width: 172px;">{{ row.location }}</td>
        </tr>
    </tbody>
</table>
</div>
