<style type="text/css">
	.splitter-container {
		width:500px;
		height:500px;
		position:relative;
		border:1px solid #ececec;
	}
</style>
<h3>Border Layout (with minSize)</h3>
<div class="splitter-container">
	<Splitter direction="horizontal" :min-size="[50, 200]">
		<template #first>
			<h3>Top</h3>
		</template>
		<template #second>
			<Splitter direction="horizontal" :min-size="[100, 50]">
				<template #first>
					<Splitter :min-size="[50, 100]" fixed>
						<template #first>
							Left
						</template>
						<template #second>
							<Splitter :min-size="50">
								<template #first>
									Center
								</template>
								<template #second>
									Right
								</template>
							</Splitter>
						</template>
					</Splitter>
				</template>
				<template #second>
					<h3>Bottom</h3>
				</template>
			</Splitter>
		</template>
	</Splitter>
</div>
