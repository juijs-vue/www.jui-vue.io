<VirtualGrid
  ref="grid"
  :columns="columns"
  :rows="rows"
  mode="virtual"
  :row-height="26"
  :height="300"
  resizable
  theme="classic"
  variant="simple"
  headline
  style="margin-top: 7px;"
  @row-click="onRowClick"
>
    <template #empty>Data does not exist.</template>
    <template #tree-toggle="{ expanded }">
        <i :class="expanded ? 'icon-right' : 'icon-left'"></i>
    </template>
</VirtualGrid>
