<Datepicker
    v-model="selected"
    variant="calendar"
    title-format="yyyy. MM"
    format="yyyy-MM-dd"
    @select="onSelect"
>
    <template #cell="{ type, no, day }">
        <span v-if="type !== 'none'" :style="{ color: day === 0 ? 'red' : day === 6 ? 'blue' : undefined }">{{ no }}</span>
    </template>
</Datepicker>
