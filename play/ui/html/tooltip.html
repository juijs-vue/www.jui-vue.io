<section>
    <h2>Default</h2>

    <p>
        Tooltip is comprised of a title and anchors on the left/right side and at the top/bottom.
        (
        <Tooltip text="Title contents" position="bottom"><span style="cursor: pointer;">Bottom</span></Tooltip>
        <Tooltip text="Title contents" position="left"><span style="cursor: pointer;">Left</span></Tooltip>
        <Tooltip text="Title contents" position="right"><span style="cursor: pointer;">Right</span></Tooltip>
        <Tooltip text="Title contents" position="top"><span style="cursor: pointer;">Top</span></Tooltip>
        )
    </p>
</section>
