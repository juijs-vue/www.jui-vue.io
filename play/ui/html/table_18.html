<div class="group">
    <button class="btn small" @click="move(3, 4)">Move</button> <button class="btn small" @click="remove(1)">Remove</button> <button class="btn small" @click="update(2, { name: 'AAA' })">Update</button>
</div>

<DataGrid
    ref="grid"
    :columns="columns"
    :rows="rows"
    resizable
    :scroll-height="200"
    style="margin-top: 7px;"
    @row-click="onRowClick"
>
    <template #cell-index="{ row }">{{ rowIndex(row) }}</template>
    <template #cell-name="{ row, value }">
        <span style="display: block; padding-left: 5px;">
            <i v-if="row.depth" class="icon-left"></i>{{ value }}
        </span>
    </template>
</DataGrid>
