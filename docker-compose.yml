services:
  web:
    build: .
    ports:
      - "8090:5000"
    volumes:
      - .:/app
      # Shadow the bind mount for .venv so the container always uses the venv
      # baked into the image (built for its own Python), not whatever's in
      # the host's local .venv/ (different Python version/platform).
      - /app/.venv
    environment:
      - SECRET_KEY=dev-only-change-me
    restart: unless-stopped
